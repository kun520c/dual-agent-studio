name: Windows offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend and public files
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design-prototype/package-lock.json
      - run: npm.cmd ci --prefix design-prototype --registry=https://registry.npmjs.org
      - run: npm.cmd run check --prefix design-prototype
      - run: npm.cmd run build --prefix design-prototype
      - run: npm.cmd test --prefix design-prototype
      - run: python -B tools/check_public_files.py
  offline:
    name: Python offline (${{ matrix.suite }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [api, manager-cli, manager, ledger, host, core, desktop, rehearsal]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt --index-url https://pypi.org/simple
      - if: matrix.suite == 'desktop'
        run: npm.cmd ci --prefix design-prototype --registry=https://registry.npmjs.org
      - if: matrix.suite == 'desktop'
        run: npm.cmd run build --prefix design-prototype
      - run: python -B tools/run_offline_checks.py --suite ${{ matrix.suite }}
